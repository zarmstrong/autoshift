name: Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: unittest (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported version and the version used by the Docker image.
        # Python 3.9 is end-of-life and has no build for newer Ubuntu runners.
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.14"
            os: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check CLI starts
        run: python auto.py --help

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
