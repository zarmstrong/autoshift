[tool.poetry]
name = "autoshift"
version = "2.1.0"
description = "AutoSHIFt: Automatically redeem Gearbox SHIFt Codes"
authors = [
    "zarmstrong <git@traffid.com>",
    "Fabian Schweinfurth <github@derfabbi.de>",
]
license = "GPLv3"
requires-poetry = ">=2.4,<3.0"

[tool.poetry.dependencies]
python = "^3.11"
APScheduler = "^3.11.3"
apprise = ">=2,<3"
beautifulsoup4 = "^4.15.0"
lxml = ">=6.1.3,<7"
requests = "^2.32.5"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.3.0"
ipdb = "^0.13.13"
jedi = "^0.18.1"
mypy = "^2.4.1"
types-requests = "^2.33.0"
debugpy = "^1.8.21"
pylint = "^2.14.3"
Flask = "^3.1.3"
autoflake = "^1.4"

[tool.mypy]
python_version = "3.11"
files = ["auto.py", "common.py", "migrations.py", "query.py", "shift.py"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.4,<3.0"]
build-backend = "poetry.core.masonry.api"
